<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>AsciiDoc Preview</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="font-awesome.min.css">
<style>
#preview-overlay { position: fixed; top: 0.5em; right: 0.75em; z-index: 1001; display: flex;
  flex-direction: column; align-items: flex-end; gap: 0.3em; max-width: calc(100% - 1.5em); }
#preview-toolbar { padding: 0.25em 0.6em;
  font: 0.8em/1.4 sans-serif; background: rgba(255, 255, 255, 0.92); border: 1px solid #ddddd8;
  border-radius: 3px; }
#preview-toolbar label { cursor: pointer; }
#preview-status { margin-left: 0.8em; color: #7a2518; }
#preview-toolbar label + label { margin-left: 0.8em; }
#preview-source { padding: 0.25em 0.6em; font: 0.8em/1.4 sans-serif; background: #fffbea; border: 1px solid #e0c96b;
  border-radius: 3px; }
#preview-source button { margin-left: 0.6em; font: inherit; cursor: pointer; }
#preview-debug { margin: 0; padding: 0.4em 0.6em; font: 0.75em/1.35 monospace; background: #fffff0;
  border: 1px solid #c90; border-radius: 3px; white-space: pre-wrap; max-width: 60em; }
#preview-banner { margin: 0 auto; max-width: 62.5em; padding: 0.6em 1.25em; background: #fbeaea;
  border-bottom: 1px solid #c33; color: #7a2518; font: 0.9em/1.4 sans-serif; white-space: pre-wrap; }
</style>
</head>
<body class="article">
<div id="preview-overlay">
<div id="preview-toolbar">
<label><input type="checkbox" id="follow" checked> Follow cursor</label>
<label><input type="checkbox" id="jump" checked> Double-click jumps to editor</label>
<label><input type="checkbox" id="scroll-editor" checked> Scroll editor with page</label>
<span id="preview-status">Connecting...</span>
</div>
<pre id="preview-debug" hidden></pre>
<div id="preview-source" hidden><span id="preview-source-text"></span><button type="button" id="preview-source-open">Open in editor</button></div>
</div>
<div id="preview-banner" hidden></div>
<div id="header"></div>
<div id="content"><p>Waiting for the first conversion...</p></div>
<script src="morphdom.js"></script>
<script src="scroll-map.js"></script>
<script src="page-sync.js"></script>
<script src="scroll-debug.js"></script>
<script src="page.js"></script>
</body>
</html>
