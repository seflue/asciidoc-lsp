[package]
name = "asciidoc-lsp"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
asciidoc-core = { path = "../asciidoc-core" }
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tower-lsp-server = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "time", "sync", "net"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
thiserror = "2"
getrandom = "0.4"

[lints]
workspace = true

[dev-dependencies]
rstest = "0.25"
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
serde_json = "1"
