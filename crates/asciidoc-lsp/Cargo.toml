[package]
name = "asciidoc-lsp"
version = "0.1.0"
edition = "2021"

[dependencies]
asciidoc-core = { path = "../asciidoc-core" }
tree-sitter = "0.25"
tower-lsp-server = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
anyhow = "1"
tracing = "0.1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
serde_json = "1"
