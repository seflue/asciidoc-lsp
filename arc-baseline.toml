# Generated by cargo-arc. Every entry freezes one dependency edge and the
# symbols crossing it; a symbol that appears later is reported again.
# Regenerate with: cargo arc check --generate-baseline
[config]
version = 1

[[violations]]
rule = "no-cycles"
from = "asciidoc-core::extractors"
to = "asciidoc-core::ventilate"
symbols = ["is_attribute_entry"]

[[violations]]
rule = "no-cycles"
from = "asciidoc-core::graph"
to = "asciidoc-core::substituted_refs"
symbols = ["extract"]

[[violations]]
rule = "no-cycles"
from = "asciidoc-core::pdf_theme"
to = "asciidoc-core::pdf_theme_yaml"
symbols = [
    "ThemeDirs",
    "check_theme",
]

[[violations]]
rule = "no-cycles"
from = "asciidoc-core::pdf_theme_yaml"
to = "asciidoc-core::pdf_theme"
symbols = [
    "GEM_FONTS_DIR",
    "PdfPath",
    "is_builtin_theme",
]

[[violations]]
rule = "no-cycles"
from = "asciidoc-core::reading"
to = "asciidoc-core::workspace"
symbols = ["Workspace"]

[[violations]]
rule = "no-cycles"
from = "asciidoc-core::substituted_refs"
to = "asciidoc-core::workspace"
symbols = ["entry_name"]

[[violations]]
rule = "no-cycles"
from = "asciidoc-core::ventilate"
to = "asciidoc-core::extractors"
symbols = [
    "block_context",
    "extract_attributes",
]

[[violations]]
rule = "no-cycles"
from = "asciidoc-core::workspace"
to = "asciidoc-core::graph"
symbols = [
    "IncludeGraph",
    "build_graph",
    "build_graph_with_overrides",
    "include_edges",
    "parse_single_file",
]

[[violations]]
rule = "no-cycles"
from = "asciidoc-core::workspace"
to = "asciidoc-core::reading"
symbols = [
    "ReadingVisitor",
    "read_in_order",
]

[[violations]]
rule = "no-cycles"
from = "asciidoc-core::workspace"
to = "asciidoc-core::substituted_refs"
symbols = ["is_predefined"]
