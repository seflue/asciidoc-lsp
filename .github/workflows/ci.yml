name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-check:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - run: cargo fmt -- --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Install Asciidoctor
        run: sudo gem install asciidoctor -v 2.0.26
      - run: cargo test
        env:
          # A missing Asciidoctor fails the tests that need it, not skips them.
          ASCIIDOC_LSP_REQUIRE_ASCIIDOCTOR: "1"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [fmt-check, lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm --prefix editors/vscode ci
      - run: npm --prefix editors/vscode run compile
      - run: npm --prefix editors/vscode test
      - run: npm --prefix editors/vscode run package

  jetbrains-plugin:
    # Not part of `just ci`; runs on every push so a server change that breaks the plugin shows up here.
    name: JetBrains plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: extractions/setup-just@v2
      - name: Install Asciidoctor
        run: sudo gem install asciidoctor -v 2.0.26
      - run: just test-jetbrains
        env:
          # A missing Asciidoctor fails the tests that need it, not skips them.
          ASCIIDOC_LSP_REQUIRE_ASCIIDOCTOR: "1"

  preview-js:
    name: Preview JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test crates/asciidoc-lsp/tests/js/*.test.js
