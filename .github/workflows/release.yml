name: Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  verify-version:
    name: Cargo version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-version.sh "${{ github.event.release.tag_name }}"

  binaries:
    name: ${{ matrix.target }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install musl toolchain
        if: contains(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Install pinned toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: bash
        env:
          ASCIIDOC_LSP_VERSION: ${{ env.TAG }}
        run: |
          if [[ "$TARGET" == *-linux-musl ]]; then
            export "CC_${TARGET//-/_}=musl-gcc"
          fi
          cargo build --release --locked -p asciidoc-lsp --target "$TARGET"
      - name: Package
        shell: bash
        env:
          COPYFILE_DISABLE: "1"
        run: |
          target="$TARGET"
          bin_dir="target/${target}/release"
          if [[ "$target" == *-windows-* ]]; then
            (cd "$bin_dir" && 7z a -tzip "$GITHUB_WORKSPACE/asciidoc-lsp-${target}.zip" asciidoc-lsp.exe)
            echo "ASSET=asciidoc-lsp-${target}.zip" >> "$GITHUB_ENV"
          else
            tar -C "$bin_dir" -czf "asciidoc-lsp-${target}.tar.gz" asciidoc-lsp
            echo "ASSET=asciidoc-lsp-${target}.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload to release
        shell: bash
        run: gh release upload "$TAG" "$ASSET" --clobber
      - name: Keep binary for the VSIX
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/asciidoc-lsp
            target/${{ matrix.target }}/release/asciidoc-lsp.exe
          if-no-files-found: error

  vsix:
    name: VSIX ${{ matrix.code_target }}
    needs: [verify-version, binaries]
    if: ${{ !cancelled() && needs.verify-version.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - code_target: linux-x64
            target: x86_64-unknown-linux-musl
          - code_target: alpine-x64
            target: x86_64-unknown-linux-musl
          - code_target: linux-arm64
            target: aarch64-unknown-linux-musl
          - code_target: alpine-arm64
            target: aarch64-unknown-linux-musl
          - code_target: darwin-x64
            target: x86_64-apple-darwin
          - code_target: darwin-arm64
            target: aarch64-apple-darwin
          - code_target: win32-x64
            target: x86_64-pc-windows-msvc
    env:
      TAG: ${{ github.event.release.tag_name }}
      CODE_TARGET: ${{ matrix.code_target }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Fetch server binary
        uses: actions/download-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: editors/vscode/server
      - name: Make binary executable
        run: chmod +x editors/vscode/server/asciidoc-lsp*
      - name: Install dependencies
        run: npm --prefix editors/vscode ci
      - name: Package
        run: npm --prefix editors/vscode run package -- "${TAG#v}" --no-git-tag-version --target "$CODE_TARGET" --out "../../asciidoc-lsp-${CODE_TARGET}.vsix"
      - name: Upload to release
        run: gh release upload "$TAG" "asciidoc-lsp-${CODE_TARGET}.vsix" --clobber

  vsix-universal:
    name: VSIX universal
    needs: verify-version
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install dependencies
        run: npm --prefix editors/vscode ci
      - name: Package
        run: npm --prefix editors/vscode run package -- "${TAG#v}" --no-git-tag-version --out ../../asciidoc-lsp-universal.vsix
      - name: Upload to release
        run: gh release upload "$TAG" asciidoc-lsp-universal.vsix --clobber
