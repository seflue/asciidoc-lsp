name: Release binaries

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install musl toolchain
        if: contains(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Install pinned toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: bash
        env:
          ASCIIDOC_LSP_VERSION: ${{ env.TAG }}
        run: |
          if [[ "$TARGET" == *-linux-musl ]]; then
            export "CC_${TARGET//-/_}=musl-gcc"
          fi
          cargo build --release --locked -p asciidoc-lsp --target "$TARGET"
      - name: Package
        shell: bash
        env:
          COPYFILE_DISABLE: "1"
        run: |
          target="$TARGET"
          bin_dir="target/${target}/release"
          if [[ "$target" == *-windows-* ]]; then
            (cd "$bin_dir" && 7z a -tzip "$GITHUB_WORKSPACE/asciidoc-lsp-${target}.zip" asciidoc-lsp.exe)
            echo "ASSET=asciidoc-lsp-${target}.zip" >> "$GITHUB_ENV"
          else
            tar -C "$bin_dir" -czf "asciidoc-lsp-${target}.tar.gz" asciidoc-lsp
            echo "ASSET=asciidoc-lsp-${target}.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload to release
        shell: bash
        run: gh release upload "$TAG" "$ASSET" --clobber
